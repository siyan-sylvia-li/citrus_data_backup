<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Study — Post-study survey</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    .survey__item {
      margin: 1.5rem 0;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid #eee;
    }
    .survey__item:last-of-type { border-bottom: 0; }
    .survey__prompt {
      font-weight: 600;
      margin: 0 0 0.75rem;
      line-height: 1.4;
    }
    .survey__scale {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
    }
    .survey__option {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0.6rem 0.4rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      line-height: 1.25;
      background: #fff;
      transition: background 0.15s, border-color 0.15s;
    }
    .survey__option:hover { background: #f3f7f4; }
    .survey__option input { margin-bottom: 0.35rem; }
    .survey__option input:checked + span { font-weight: 600; }
    .survey__option:has(input:checked) {
      border-color: #2D5A43;
      background: #e8f1ec;
    }
    @media (max-width: 560px) {
      .survey__scale { grid-template-columns: 1fr; }
      .survey__option { flex-direction: row; justify-content: flex-start; gap: 0.5rem; padding: 0.5rem 0.75rem; }
      .survey__option input { margin-bottom: 0; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1 class="topbar__title">Post-study survey</h1>
  </header>

  <main class="start">
    <form class="start__card" method="post" action="{{ url_for('post_survey') }}">
      <p class="survey__progress" style="font-size:0.8rem;color:#777;margin:0 0 0.5rem;">Page 2 of 2</p>
      <h2 class="start__title">Almost done</h2>
      <p class="start__body">
        Please rate how much you agree with each statement about the AI assistant.
      </p>

      {% if error %}
        <div class="start__error">{{ error }}</div>
      {% endif %}

      <input type="hidden" name="page" value="ai_likert" />

      {% for key, prompt in items %}
        <fieldset class="survey__item">
          <legend class="survey__prompt">{{ prompt }}</legend>
          <div class="survey__scale">
            {% for value, label in likert_options %}
              <label class="survey__option">
                <input
                  type="radio"
                  name="{{ key }}"
                  value="{{ value }}"
                  {% if answers.get(key) == value %}checked{% endif %}
                  required
                />
                <span>{{ label }}</span>
              </label>
            {% endfor %}
          </div>
        </fieldset>
      {% endfor %}

      <fieldset class="survey__item">
        <legend class="survey__prompt">{{ feedback_prompt }}</legend>
        <textarea
          name="additional_feedback"
          rows="4"
          placeholder="Optional"
          style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font:inherit;"
        >{{ feedback }}</textarea>
      </fieldset>

      <button type="submit" class="start__btn">Continue</button>
    </form>
  </main>
</body>
</html>
